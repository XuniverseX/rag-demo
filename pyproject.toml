[project]
name = "medical-agent-interview"
version = "0.1.0"
description = "Explainable medical service agent: LangGraph, RAG, MCP, durable memory"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.12,<2", "langchain-openai>=1,<2", "sqlalchemy>=2,<3",
  "psycopg[binary,pool]>=3.2,<4", "aiosqlite>=0.20,<1",
  "numpy>=2,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["medical_agent"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
