<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>诊间 · 医疗服务助手</title>
<style>
:root{--ink:#183c44;--muted:#667d84;--teal:#137a79;--light:#eaf1f3;--paper:#fff;--line:#d8e3e6;--amber:#8e5b17;--soft:#fff6e5}
*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #50bdb6;outline-offset:3px}
.app{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:100vh}aside{padding:32px 24px;background:#f5f9fa;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}
.brand{font:30px "Songti SC",serif;letter-spacing:3px}.brand span{font:12px sans-serif;color:var(--muted);display:block;letter-spacing:2px;margin-top:8px}.cross{display:inline-grid;place-items:center;background:var(--teal);color:white;width:34px;height:34px;font:28px sans-serif;border-radius:50%;margin-right:10px}
.label{color:var(--muted);font-size:12px;letter-spacing:1px;margin-bottom:8px}.muted{color:var(--muted);font-size:13px}.aside-section{border-top:1px solid var(--line);padding-top:20px}select{width:100%;border:1px solid var(--line);background:white;padding:9px;border-radius:6px;color:var(--ink)}
button{border:1px solid var(--line);color:var(--ink);background:white;padding:10px 14px;border-radius:6px;transition:background .15s}button:hover{background:#e2eeee}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover{background:#0a6765}.wide{width:100%;margin-top:10px}.text-button{border:0;background:transparent;padding:5px 0;color:var(--muted);font-size:12px}.text-button:hover{background:transparent;color:var(--ink)}
main{display:flex;flex-direction:column;min-width:0;height:100vh}header{padding:24px 40px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.65)}h1{margin:0;font-size:18px;font-weight:600}header p{margin:3px 0 0;font-size:12px;color:var(--muted)}.badge{border:1px solid #b7d9d8;border-radius:20px;padding:5px 12px;color:var(--teal);font-size:12px}
.conversation{overflow:auto;flex:1;padding:32px max(24px,calc((100% - 780px)/2));scroll-behavior:smooth}.welcome{padding:22px 0 35px}.welcome h2{font:34px/1.4 "Songti SC",serif;margin:0 0 10px}.welcome p{color:var(--muted);max-width:520px}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.suggestions button{font-size:13px}
.message{margin:20px 0;max-width:100%}.message .who{color:var(--muted);font-size:11px;margin-bottom:5px;letter-spacing:1px}.bubble{padding:17px 20px;background:white;border:1px solid var(--line);border-radius:3px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{margin-left:15%;}.message.user .bubble{background:#dceced;border-color:#c9dfe0;border-radius:14px 3px 14px 14px}.message.user .who{text-align:right}
.sources{font-size:12px;color:var(--teal);margin-top:10px}.sources details{border-top:1px solid var(--line);padding:8px 0}.sources p{color:var(--muted)}.operation{margin:20px 0;background:white;border:1px solid #83b9b5;border-radius:10px;padding:22px}.operation h3{font-size:16px;margin:0 0 12px}.operation dl{display:grid;grid-template-columns:80px 1fr;font-size:14px;gap:6px}.operation dt{color:var(--muted)}.operation dd{margin:0}.operation .actions{display:flex;gap:10px;margin-top:20px}
.compose-area{padding:16px max(24px,calc((100% - 780px)/2)) 20px;background:var(--light);border-top:1px solid var(--line)}.composer{background:white;border:1px solid #b7cbce;border-radius:10px;display:flex;align-items:flex-end;padding:10px;gap:12px}textarea{resize:none;flex:1;min-width:0;width:auto;min-height:58px;max-height:130px;padding:5px;border:0;background:transparent;color:var(--ink);outline:none}.composer button{flex-shrink:0;min-width:72px}.footnote{font-size:11px;color:var(--muted);margin-top:9px}.status{min-height:21px;color:var(--teal);font-size:12px;margin-bottom:6px}.lab{font-size:12px;color:var(--muted);margin-top:8px}.lab pre{white-space:pre-wrap;font-family:ui-monospace,monospace;background:white;padding:10px;max-height:120px;overflow:auto}.notice{font-size:12px;background:var(--soft);color:var(--amber);padding:10px;border-radius:6px}.memory-list{font-size:13px;margin:8px 0}.error{color:#a13627}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{padding:15px 20px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:24px}.brand span{display:inline;margin-left:10px}.aside-section{padding-top:10px}.side-tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}.aside-bottom{display:none}main{height:85vh}header{padding:18px 20px}.conversation{padding:20px}.compose-area{padding:12px 20px}.welcome h2{font-size:27px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div class="app">
<aside>
  <div class="brand"><b class="cross">+</b>诊间<span>医疗服务 · 演示项目</span></div>
  <div><div class="label">当前演示身份</div><select id="account" aria-label="选择演示账号"><option value="alice">Alice · 演示患者 A</option><option value="bob">Bob · 演示患者 B</option></select><button class="wide" id="new-session">开启新会话</button></div>
  <div class="side-tools">
    <section class="aside-section"><div class="label">跨会话记忆</div><div id="memory" class="memory-list">暂未保存偏好</div><select id="department" aria-label="科室偏好"><option>内科</option><option>皮肤科</option><option>外科</option><option>儿科</option></select><button class="wide" id="save-memory">保存科室偏好</button><button class="text-button" id="delete-memory">删除长期记忆</button></section>
    <section class="aside-section"><div class="label">我的预约</div><div id="appointments" class="muted">暂无预约</div><button class="text-button" id="refresh">刷新预约与记忆</button></section>
  </div>
  <div class="aside-bottom" style="margin-top:auto"><div class="notice">使用合成知识与模拟医院数据，不用于诊断、处方或真实挂号。</div><button class="text-button" id="delete-data">删除当前账号全部演示数据</button></div>
</aside>
<main>
  <header><div><h1>医疗服务助手</h1><p>院务咨询 · 科室导诊 · 预约办理</p></div><span class="badge" id="mode">连接中</span></header>
  <div class="conversation" id="conversation" role="log" aria-live="polite">
    <div class="welcome"><div class="label">开始一次咨询</div><h2>就诊前的疑问，<br>在这里一步步理清。</h2><p>可以询问就诊流程、描述症状，或选择科室预约。涉及预约变更时，会先请你核对并确认。</p><div class="suggestions"><button data-prompt="预约挂号需要什么证件">挂号需要什么证件？</button><button data-prompt="我咳嗽了三天，应该挂什么科">咳嗽三天，挂什么科？</button><button data-prompt="帮我预约内科">预约内科</button><button data-prompt="帮我预约，按上次偏好">按记忆中的偏好预约</button></div></div>
  </div>
  <div class="compose-area"><div id="status" class="status" aria-live="polite"></div><form id="chat-form" class="composer"><textarea id="message" maxlength="2000" placeholder="描述你的问题，例如：帮我预约皮肤科" aria-label="咨询内容"></textarea><button class="primary" id="send">发送</button></form><div class="footnote">当前出现胸痛、呼吸困难、意识异常或大量出血时，请立即联系急救；中国大陆可拨打 120。</div><details class="lab"><summary>面试演示：查看本轮执行轨迹</summary><pre id="trace">发送一条消息后查看。</pre></details></div>
</main></div>
<script>
let token='',thread='',pending=null,busy=false;const $=id=>document.getElementById(id);const account=$('account');
const labels={init:'准备检索问题',evaluate:'评估知识证据',rewrite:'改写检索问题',generate:'生成候选回答',reflect:'检查回答依据',publish:'发布已校验回答',fallback:'说明知识不足',guard:'检查风险与上下文',route:'识别服务需求',retrieve:'检索就诊资料',answer:'生成有依据的回答',triage:'收集导诊信息',prepare:'查询并准备操作',confirm:'等待核对操作',execute:'办理已确认操作',finish:'完成本轮服务'};
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...options.headers}});if(!response.ok){let data={};try{data=await response.json()}catch{}throw Error(data.detail||'服务暂不可用')}return response.json()}
function status(value,error=false){$('status').textContent=value;$('status').classList.toggle('error',error)}
function setBusy(value){busy=value;document.querySelectorAll('button,select').forEach(element=>element.disabled=value)}
function message(role,text){const item=document.createElement('div');item.className='message '+role;const name=document.createElement('div');name.className='who';name.textContent=role==='user'?'你':'诊间助手';const body=document.createElement('div');body.className='bubble';body.textContent=text;item.append(name,body);$('conversation').append(item);scroll();return item}
function scroll(){$('conversation').scrollTop=$('conversation').scrollHeight}
function render(result){pending=result.pending_operation;const item=message('assistant',result.answer||'请核对以下操作。');if(result.citations?.length){const sources=document.createElement('div');sources.className='sources';for(const source of result.citations){const detail=document.createElement('details'),summary=document.createElement('summary'),body=document.createElement('p');summary.textContent='参考：'+source.title+' · '+(source.synthetic?'合成资料':'导入资料');body.textContent=source.text+'\n来源：'+source.source+'｜版本：'+source.version;detail.append(summary,body);sources.append(detail)}item.append(sources)}document.querySelectorAll('.operation').forEach(element=>element.remove());if(pending){const card=document.createElement('section');card.className='operation';const heading=document.createElement('h3');heading.textContent=pending.action==='book'?'核对预约详情':'核对取消预约';card.append(heading);const list=document.createElement('dl');for(const [key,value] of [['科室',pending.department],['医生',pending.doctor],['日期',pending.date]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;list.append(dt,dd)}card.append(list);const actions=document.createElement('div');actions.className='actions';for(const [approved,title] of [[true,pending.action==='book'?'确认预约':'确认取消'],[false,'放弃本次操作']]){const button=document.createElement('button');button.type='button';button.textContent=title;button.className=approved?'primary':'';button.onclick=()=>confirmOperation(approved);actions.append(button)}card.append(actions);$('conversation').append(card)}$('trace').textContent=(result.trace||[]).join(' → ')+'\n会话：'+thread+(result.metrics?'\n测量：'+JSON.stringify(result.metrics,null,2):'');if(result.rag?.status)$('trace').textContent+='\nRAG：'+JSON.stringify(result.rag,null,2);scroll()}
async function refresh(){const [memories,appointments]=await Promise.all([api('/api/memory'),api('/api/appointments')]);$('memory').textContent=memories.length?memories.map(item=>item.key+': '+item.value).join('\n'):'暂未保存偏好';$('appointments').replaceChildren();for(const item of appointments){const element=document.createElement('p');element.textContent=item.department+' · '+item.date+' · '+(item.status==='booked'?'已预约':'已取消');$('appointments').append(element)}if(!appointments.length)$('appointments').textContent='暂无预约'}
async function start(force=false){setBusy(true);try{const login=await api('/api/demo-login',{method:'POST',body:JSON.stringify({user:account.value})});token=login.token;const key='medical-demo-thread-'+account.value;thread=force?'':localStorage.getItem(key)||'';let restored=null;if(thread){try{restored=await api('/api/threads/'+thread)}catch{thread=''}}if(!thread){thread=(await api('/api/threads',{method:'POST'})).thread_id;localStorage.setItem(key,thread)}document.querySelectorAll('.message,.operation').forEach(element=>element.remove());pending=null;if(restored?.answer||restored?.pending_operation)render(restored);const health=await api('/api/health');$('mode').textContent=health.mode==='offline'?'离线演示':'在线模型 · 合成资料';await refresh();status('已连接。可以开始咨询。')}catch(error){status(error.message,true)}finally{setBusy(false)}}
async function send(text){if(busy||!text.trim())return;setBusy(true);message('user',text);$('message').value='';$('trace').textContent='';status('正在处理你的问题…');try{const response=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({thread_id:thread,message:text,request_id:crypto.randomUUID()})});if(!response.ok)throw Error('请求失败，请重新登录或稍后重试。');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let split;while((split=buffer.indexOf('\n\n'))>=0){const frame=buffer.slice(0,split);buffer=buffer.slice(split+2);if(!frame.startsWith('data: '))continue;const event=JSON.parse(frame.slice(6));if(event.type==='stage'){status(labels[event.node]||'正在处理…');$('trace').textContent+=event.node+'\n'}if(event.type==='result'){render(event.data);status(event.data.pending_operation?'请核对操作详情。':'本轮处理完成。')}if(event.type==='error')throw Error(event.message)}if(done)break}await refresh()}catch(error){status(error.message,true)}finally{setBusy(false)}}
async function confirmOperation(approved){if(busy||!pending)return;setBusy(true);try{const result=await api('/api/confirm',{method:'POST',body:JSON.stringify({thread_id:thread,operation_id:pending.operation_id,approved,request_id:crypto.randomUUID()})});render(result);await refresh();status(approved?'操作处理完成。':'已放弃本次操作。')}catch(error){status(error.message,true)}finally{setBusy(false)}}
$('chat-form').onsubmit=event=>{event.preventDefault();send($('message').value)};$('message').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send($('message').value)}};document.querySelectorAll('[data-prompt]').forEach(button=>button.onclick=()=>send(button.dataset.prompt));account.onchange=()=>start();$('new-session').onclick=()=>start(true);
$('refresh').onclick=()=>refresh().catch(error=>status(error.message,true));$('save-memory').onclick=async()=>{try{await api('/api/memory',{method:'PUT',body:JSON.stringify({key:'preferred_department',value:$('department').value})});await refresh();status('已保存科室偏好。')}catch(error){status(error.message,true)}};$('delete-memory').onclick=async()=>{try{await api('/api/memory',{method:'DELETE'});await refresh();status('已删除长期记忆。')}catch(error){status(error.message,true)}};$('delete-data').onclick=async()=>{if(!window.confirm('删除当前账号的全部演示会话、记忆和模拟预约？'))return;try{await api('/api/user-data',{method:'DELETE'});await start(true)}catch(error){status(error.message,true)}};
start();
</script></body></html>
